name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build extension
        run: npm run build

      - name: Verify manifest version matches tag
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('dist/manifest.json','utf8')).version)")
          echo "tag=${GITHUB_REF_NAME} manifest=v${VERSION}"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::manifest 版本 v${VERSION} 与 tag ${GITHUB_REF_NAME} 不一致"
            exit 1
          fi

      - name: Package extension
        run: |
          cd dist
          zip -r "../nga-neo-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nga-neo-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
